  <style>
    :root { color-scheme: dark; --gold:#f5cf62; --green:#159447; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:#fff; background:

    .cta {

      background:linear-gradient(#20b957,#08772d); border:1px solid #8cf3a5;
      box-shadow:0 5px 0 #06491c, 0 12px 28px #0009;
      transition:transform .15s ease, filter .15s ease;
    }
    .cta:hover { transform:translateY(-2px); filter:brightness(1.08); }
    .wa { width:26px; height:26px; flex:0 0 26px; }
    .note { color:#c9c4b5; font-size:12px; line-height:1.5; margin:18px auto 0; max-width:600px; }
    footer { margin-top:20px; color:#817b6c; font-size:11px; }
    @media (max-width:480px) { body { padding:12px; } .banner { border-radius:10px; } .cta { padding:14px 16px; } }
